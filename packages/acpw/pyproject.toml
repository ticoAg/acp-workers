[project]
name = "acpw"
version = "0.7.0"
description = "One WebSocket, many ACP agents. Host agents plan; workers execute."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "ticoAg" }]
keywords = ["acp", "agent-client-protocol", "skills", "grok", "claude", "codex", "cursor"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/ticoAg/acp-workers"
Skills = "https://skills.sh/ticoAg/acp-workers"

[project.scripts]
acpw = "acpw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acpw"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/acpw/cli.py" = ["BLE001"]
"src/acpw/service.py" = ["SIM115"]
